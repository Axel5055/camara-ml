<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #fff; color: #18181b; text-align: center; padding: 24px; }
        img { width: 160px; height: auto; }
        h1 { font-size: 22px; margin: 16px 0 6px; }
        p { color: #52525b; margin: 0 0 20px; }
        button { background: #18181b; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <img src="/images/logo.png" alt="ML Grupo Comercial">

</body>
</html>
